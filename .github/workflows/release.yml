# Releases asc-dexdec-worker, the decompile backend asc runs as its built-in
# `dexdec`. asc downloads
#   https://github.com/DroidASC/asc-dexdec/releases/latest/download/asc-dexdec-worker-p<P>-<target>.tar.gz
# (and its .sha256), P being the backend protocol version it speaks, so the
# release is published as latest. Upstream dexdec's desktop releases are made
# in asLody/dexdec, not here.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      asc_rs_ref:
        description: asc-rs ref the worker is built against
        required: false
        default: main
permissions:
  contents: write
env:
  # asc-rs, checked out next to this repository, provides the protocol crate.
  ASC_RS_REF: ${{ inputs.asc_rs_ref || 'main' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: asc-dexdec
      - uses: actions/checkout@v7
        with:
          repository: Ylarod/asc-rs
          ref: ${{ env.ASC_RS_REF }}
          path: asc-rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: asc-dexdec/asc-dexdec-worker -> target
      - name: Build
        working-directory: asc-dexdec/asc-dexdec-worker
        run: cargo build --release --target ${{ matrix.target }}
      # asc-dexdec-worker-p<P>-<target>/{asc-dexdec-worker[.exe],LICENSE},
      # nothing else: asc's installer rejects archives with other entries.
      # P comes from the binary itself (x86_64-apple-darwin runs under
      # Rosetta). COPYFILE_DISABLE keeps macOS tar from adding ._ files.
      - name: Package
        shell: bash
        env:
          COPYFILE_DISABLE: 1
        run: |
          worker=asc-dexdec/asc-dexdec-worker/target/${{ matrix.target }}/release/asc-dexdec-worker
          [[ "${{ matrix.target }}" == *-windows-* ]] && worker=$worker.exe
          protocol=$("$worker" --protocol-version)
          [[ "$protocol" =~ ^[0-9]+$ ]] || { echo "bad protocol version: $protocol"; exit 1; }
          name=asc-dexdec-worker-p${protocol}-${{ matrix.target }}
          mkdir "$name"
          cp "$worker" asc-dexdec/LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          if command -v shasum >/dev/null; then sha256=(shasum -a 256); else sha256=(sha256sum); fi
          "${sha256[@]}" "$name.tar.gz" > "$name.tar.gz.sha256"
          tar tzf "$name.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: asc-dexdec-worker-p*.tar.gz*
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The worker carries upstream dexdec's version: v<version> releases it,
      # v<version>-r<N> re-releases it with worker-only changes.
      - name: Tag matches the worker's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' asc-dexdec-worker/Cargo.toml | head -1)
          [[ "$GITHUB_REF_NAME" =~ ^v${version//./\\.}(-r[0-9]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is not v$version or v$version-r<N>"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Immutable releases lock assets once a release is published, so upload
      # everything to a draft first and publish it last.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
